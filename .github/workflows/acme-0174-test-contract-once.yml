name: ACME-0174 test contract once

on:
  push:
    branches:
      - diagnostic/acme-0174-prettier

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/acme-0174-prettier
          fetch-depth: 0

      - name: Repair reuse-provenance expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'tests/integration/execution-engine-sqlite.test.ts',
              """    expect(committed).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      revision: 1,
""",
              """    expect(committed).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      reuseReason: 'fresh',
      revision: 1,
""",
          )
          replace_once(
              'tests/integration/execution-engine-sqlite.test.ts',
              """    expect(resumed).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      revision: 1,
""",
              """    expect(resumed).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      reuseReason: 'recorded-response-resume',
      revision: 1,
""",
          )
          replace_once(
              'tests/scenario/narrative-phase-5.test.ts',
              """    expect(first).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      revision: 1,
""",
              """    expect(first).toEqual({
      status: 'committed',
      executionId,
      replayed: false,
      reuseReason: 'fresh',
      revision: 1,
""",
          )
          replace_once(
              'tests/scenario/research-phase-5.test.ts',
              """    expect(stepA.result).toEqual({
      status: 'committed',
      executionId: stepA.executionId,
      replayed: false,
      revision: 1,
""",
              """    expect(stepA.result).toEqual({
      status: 'committed',
      executionId: stepA.executionId,
      replayed: false,
      reuseReason: 'fresh',
      revision: 1,
""",
          )
          replace_once(
              'tests/scenario/research-phase-5.test.ts',
              "      expect(repeated).toEqual({ ...step.result, replayed: true });\n",
              """      expect(repeated).toEqual({
        ...step.result,
        replayed: true,
        reuseReason: 'committed-execution',
      });
""",
          )
          PY

          rm .github/workflows/acme-0174-test-contract-once.yml
          git diff --check

      - name: Commit repaired expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/execution-engine-sqlite.test.ts tests/scenario/narrative-phase-5.test.ts tests/scenario/research-phase-5.test.ts .github/workflows/acme-0174-test-contract-once.yml
          git commit -m "ACME-0174: align compatibility expectations with reuse provenance"
          git push origin HEAD:diagnostic/acme-0174-prettier
