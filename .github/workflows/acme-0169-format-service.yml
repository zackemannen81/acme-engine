name: ACME-0169 service formatter

on:
  push:
    branches:
      - felix/acme-0169-runnable-runtime-composition

permissions:
  contents: write

# One-shot helper: canonical-format the service file and remove itself.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: felix/acme-0169-runnable-runtime-composition
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write apps/cli/src/acme-runtime-service.ts
      - run: rm .github/workflows/acme-0169-format-service.yml
      - name: Commit canonical formatting and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/acme-runtime-service.ts .github/workflows/acme-0169-format-service.yml
          git commit -m "ACME-0169: apply canonical service formatting"
          git push origin HEAD:felix/acme-0169-runnable-runtime-composition
