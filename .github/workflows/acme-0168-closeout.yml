name: ACME-0168 closeout

on:
  push:
    branches:
      - felix/acme-0168-postgres-restart-fixture

permissions:
  contents: write

# One-shot closeout: archive task, journal evidence, restore template, self-delete.
jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: felix/acme-0168-postgres-restart-fixture
      - name: Archive completed child task and journal verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current_path = Path('docs/CURRENT_TASK.md')
          template_path = Path('docs/template_CURRENT_TASK.md')
          journal_path = Path('docs/JOURNAL.md')
          archive_path = Path('docs/finished/ACME-0168_postgres-restart-fixture.md')

          current = current_path.read_text()
          if 'Task ID: ACME-0168' not in current:
              raise SystemExit('ACME-0168 is not the active child task')
          completed = current.replace('Status: In Progress', 'Status: Complete', 1)
          completed = completed.replace('- [ ]', '- [x]')
          completed = completed.replace(
              '- Current state: Child charter frozen; stale fixture isolated.\n- Next recommended step: apply the two test-only repairs and run canonical CI.\n- Blockers: None.\n- Child tasks: None.\n- Resume condition for parent: ACME-0168 merged/accepted and PostgreSQL gate green on the corrected baseline.\n- Open questions: None.',
              '- Current state: Complete. The stale Stage A PostgreSQL restart fixture now derives structural source segment ids from the actual provider request and reports zero new calls on resume.\n- Next recommended step: review/merge PR #34, then rebase or update parent PR #33 onto the corrected baseline and rerun its full canonical gates.\n- Blockers: None inside this child.\n- Child tasks: None.\n- Resume condition for parent: PR #34 accepted into `main`; then ACME-0167 can rerun PostgreSQL against the corrected baseline.\n- Open questions: None.',
          )
          completed += '\n## Completion Evidence\n\n- Canonical CI run `32234497958` completed successfully in both jobs.\n- `verify`: documentation, formatting, lint, typecheck, package boundaries, unit, conformance, integration, deterministic scenarios and build all passed.\n- `postgres`: typecheck and the complete PostgreSQL adapter suite passed, including the repaired Stage A restart test.\n- Diff against task base contains no production code: only this task documentation/closeout and `tests/postgres/evidence-stage-a-import.test.ts`.\n- No live model call, deployment, core change or Evidence product behavior change was performed.\n'

          archive_path.write_text(completed)
          current_path.write_text(template_path.read_text())

          journal = journal_path.read_text()
          heading = '# Journal\n\n'
          if not journal.startswith(heading):
              raise SystemExit('Unexpected JOURNAL.md heading')
          entry = '''## 2026-08-19 — ACME-0168: refresh the PostgreSQL restart fixture\n\n- Date: 2026-08-19\n- Author: OpenAI assistant for Felix integration\n- Task: ACME-0168, Complete. Archived to\n  `docs/finished/ACME-0168_postgres-restart-fixture.md`.\n- Change: Test-only repair. The Stage A restart fixture now derives current\n  structural source segment ids from the provider request, emits complete\n  segment coverage, and asserts zero new model calls on resumed projection\n  while total provider traffic remains exactly one call. No production, core,\n  POC #1 or Evidence behavior changed.\n- Verification: canonical CI run `32234497958` passed both `verify` and\n  `postgres`; the full docs/format/lint/typecheck/boundaries/unit/conformance/\n  integration/scenario/build chain and the complete PostgreSQL suite are green.\n- Handoff: PR #34 is the bounded baseline repair that unblocks ACME-0167 /\n  PR #33. `docs/CURRENT_TASK.md` is restored to the template.\n- Signature: OpenAI assistant\n\n'''
          journal_path.write_text(heading + entry + journal[len(heading):])
          PY
          rm .github/workflows/acme-0168-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_TASK.md docs/JOURNAL.md docs/finished/ACME-0168_postgres-restart-fixture.md .github/workflows/acme-0168-closeout.yml
          git commit -m "ACME-0168: archive verified child task"
          git push origin HEAD:felix/acme-0168-postgres-restart-fixture
