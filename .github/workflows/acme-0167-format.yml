name: ACME-0167 canonical formatter

on:
  push:
    branches:
      - felix/canonical-acme-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: felix/canonical-acme-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cli/src/acme-runtime-host.ts
      - name: Commit canonical formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/acme-0167-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/acme-runtime-host.ts .github/workflows/acme-0167-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ACME-0167: apply canonical runtime host formatting"
          git push origin HEAD:felix/canonical-acme-runtime
