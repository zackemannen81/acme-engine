name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check package boundaries
        run: pnpm boundaries

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run conformance tests
        run: pnpm test:conformance

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run deterministic scenarios
        run: pnpm test:scenario

      - name: Build packages
        run: pnpm build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acme -d acme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export only ./dist (see package.json exports).
      # The hermetic verify job emits dist via typecheck before tests; this
      # job must do the same or Vitest cannot resolve @acme/* entry points.
      - name: Typecheck (emit package dist)
        run: pnpm typecheck

      - name: Run PostgreSQL adapter suite
        env:
          ACME_POSTGRES_URL: postgresql://acme:acme@127.0.0.1:5432/acme
        run: pnpm test:postgres
